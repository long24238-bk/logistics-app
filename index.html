<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기사님 물류비">
<meta name="theme-color" content="#232629">
<title>신신사 기사님 물류비</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="core.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="demoBar" class="demo" hidden>데모 모드 — 이 기기에만 저장됩니다 (config.js에 Supabase 정보를 넣으면 실제 운영)</div>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
/* 홈 화면에 추가 (앱처럼 설치) */
const Install={
  prompt:null,
  standalone:()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true,
  ios:()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1),
  card(){if(this.standalone())return "";const ios=this.ios();
    return `<section class="card install"><h2>홈 화면에 앱처럼 추가하기</h2>
      <p class="muted" style="margin:0 0 12px">한 번 추가해 두면 다음부터 아이콘만 눌러 바로 입력할 수 있어요.</p>
      ${ios?"":`<button type="button" class="btn primary big" id="instBtn" style="width:100%">홈 화면에 추가하기</button><p class="muted" style="text-align:center;margin:6px 0 4px">※ 안드로이드폰(갤럭시 등) 전용</p>`}
      <details ${ios?"open":""}><summary>갤럭시 (삼성 인터넷·크롬)</summary><ol class="steps">
        <li><b>삼성 인터넷</b>: 아래쪽 <b>≡ 메뉴</b> → <b>+ 현재 페이지 추가</b> → <b>홈 화면</b> → <b>추가</b></li>
        <li><b>크롬</b>: 오른쪽 위 <b>⋮</b> → <b>홈 화면에 추가</b> (또는 <b>앱 설치</b>) → <b>설치</b></li>
        <li>홈 화면에 생긴 <b>물류비</b> 아이콘을 누르면 바로 열립니다.</li></ol></details>
      <details ${ios?"open":""}><summary>아이폰 (Safari)</summary><ol class="steps">
        <li><b>Safari</b>로 이 주소를 엽니다 (카카오톡 안에서 열렸다면 오른쪽 아래 <b>Safari로 열기</b>).</li>
        <li>아래쪽 가운데 <b>공유 버튼(□↑)</b>을 누릅니다.</li>
        <li>목록을 내려 <b>홈 화면에 추가</b> → 오른쪽 위 <b>추가</b>를 누릅니다.</li></ol></details>
    </section>`},
  bind(app){const b=app.querySelector("#instBtn");if(!b)return;
    b.onclick=async()=>{if(this.prompt){this.prompt.prompt();const r=await this.prompt.userChoice;this.prompt=null;if(r.outcome==="accepted")toast("홈 화면에 추가했습니다");}
      else{const d=app.querySelector(".install details");if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"center"})}toast("브라우저 메뉴에서 '홈 화면에 추가'를 눌러 주세요")}}}
};
addEventListener("beforeinstallprompt",e=>{e.preventDefault();Install.prompt=e});
addEventListener("appinstalled",()=>{Install.prompt=null;toast("홈 화면에 추가했습니다")});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});

/* 한 앱: 로그인할 때 기사님/관리자를 고르면 그 화면으로 들어감 */
const App={
  role:LS.get("lg_role")||"driver",err:"",cur:null,token:null,
  enter(u,token){this.token=token;LS.set("lg_session",JSON.stringify({token,role:u.role}));LS.set("lg_role",u.role);
    this.cur=u.role==="admin"?AdminApp:DriverApp;this.cur.start(u,token)},
  showLogin(){
    document.body.classList.remove("has-tabs","admin");document.getElementById("demoBar").hidden=!DEMO;
    const app=document.getElementById("app"),r=this.role,last=LS.get("lg_last_"+r)||"";
    app.innerHTML=`<div class="wrap"><div class="login">
      <div class="logo"><img class="logoImg" src="shinshin-logo.png" alt="SHINSHIN" style="height:18px;width:auto;max-width:62%;flex:none"><h1 style="font-size:17px;padding-left:12px;border-left:1px solid #555b61;color:#cfd3d6;font-weight:500;white-space:nowrap">물류비</h1></div>
      <p class="muted" style="margin:0 0 20px">(주)신신사 · 기사님 운행 물류비 입력과 관리</p>
      <form id="lf" class="card">
        <div class="seg" role="group" aria-label="로그인 종류"><button type="button" data-r="driver" aria-pressed="${r==="driver"}">기사님</button><button type="button" data-r="admin" aria-pressed="${r==="admin"}">관리자</button></div>
        <label>${r==="admin"?"관리자 아이디":"아이디 (이름)"}<input id="lid" autocomplete="username" value="${esc(last)}" placeholder="${r==="admin"?"admin":"예) 김희정"}" required></label>
        ${r==="admin"?'<label>비밀번호<input id="lpw" type="password" autocomplete="current-password" required></label>'
          :'<label>PIN (숫자 4~6자리)<input id="lpw" type="password" autocomplete="current-password" inputmode="numeric" maxlength="6" class="pin" required></label>'}
        <p class="err" id="lerr">${esc(this.err)}</p>
        <button class="btn primary big" id="lbtn" type="submit">${r==="admin"?"관리자 로그인":"로그인"}</button>
      </form>
      <p class="muted" style="margin:12px 2px 14px">${r==="admin"?"관리자는 대시보드, 기사님 등록, 전체 운행 내역, 엑셀을 관리합니다.":"처음이면 관리자에게 받은 처음 PIN으로 들어온 뒤 본인 PIN으로 바꿉니다. PIN을 잊었으면 관리자에게 초기화를 요청하세요."}</p>
      ${Install.card()}
      <div class="brand"><img src="shinshin-logo.png" alt="SHINSHIN"><span>물류비 관리 시스템</span></div>
    </div></div>`;
    app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{this.role=b.dataset.r;this.err="";this.showLogin()});
    app.querySelector("#lf").onsubmit=async e=>{e.preventDefault();const id=app.querySelector("#lid").value.trim(),pw=app.querySelector("#lpw").value,btn=app.querySelector("#lbtn");btn.disabled=true;
      try{const u=await rpc("lg_login",{p_role:r,p_login:id,p_secret:pw});LS.set("lg_last_"+r,id);this.err="";this.enter(u,u.token)}
      catch(err){this.err=err.message;btn.disabled=false;app.querySelector("#lerr").textContent=err.message}};
    Install.bind(app);
    if(!last)app.querySelector("#lid").focus();
  },
  logout:async()=>{try{await rpc("lg_logout",{p_token:App.token})}catch(e){}App.end()},
  end(){LS.del("lg_session");if(this.cur)this.cur.stop();this.cur=null;this.token=null;this.showLogin()},
  expired(){if(App.cur){App.err=ERR.SESSION_EXPIRED;App.end()}},
  async boot(){onSessionExpired=()=>App.expired();
    let s=null;try{s=JSON.parse(LS.get("lg_session")||"null")}catch(e){}
    if(s&&s.token){try{const u=await rpc("lg_me",{p_token:s.token});return this.enter(u,s.token)}catch(e){LS.del("lg_session")}}
    this.showLogin()}
};
</script>
<script src="driver.js"></script>
<script src="admin.js"></script>
<script>App.boot()</script>
</body>
</html>
